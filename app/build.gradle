plugins { id 'com.android.application' }
android {
    namespace 'com.leybotdy.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.leybotdy.app'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'armeabi-v7a' }
    }
    // La variante debug utilise la clé debug temporaire générée par Android Gradle Plugin.
    // Ne jamais stocker de mot de passe ou de clé privée dans le dépôt.
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
