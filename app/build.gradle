plugins { id 'com.android.application' }
android {
    namespace 'com.leybotdy.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.leybotdy.app'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'armeabi-v7a' }
    }
    signingConfigs { main { storeFile file('leybotdy.p12'); storePassword 'leybotdy'; keyAlias 'leybotdy'; keyPassword 'leybotdy'; storeType 'pkcs12' } }
    buildTypes { debug { signingConfig signingConfigs.main } }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
