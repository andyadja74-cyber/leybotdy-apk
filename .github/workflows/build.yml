name: Build APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: ggml-org/llama.cpp, path: llama.cpp }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Compiler llama-server (32 bits)
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          grep -rl vcvtnq_s32_f32 llama.cpp/ggml/src | xargs sed -i 's/vcvtnq_s32_f32/vcvtnq_s32_f32_compat/g'
          cmake -S llama.cpp -B build -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DANDROID_ARM_NEON=ON -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build build --target llama-server -j4
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp build/bin/llama-server app/src/main/jniLibs/armeabi-v7a/libllama_server.so
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: LEYBOTDY-apk, path: app/build/outputs/apk/debug/app-debug.apk }
